                f"{path} is not a supported WAV file ({reason}). Convert it first, for example with: {_FFMPEG_COMMAND}"
            )


        def _to_float32(data: bytes, fmt: _Format) -> npt.NDArray[np.float32]:
            if fmt.tag == _IEEE_FLOAT:
